<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Proposal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffd1ff);
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 24px;
      animation: floatUp 7s linear infinite;
      opacity: 0.7;
    }

    .heart:nth-child(1) { left: 10%; animation-delay: 0s; font-size: 22px; }
    .heart:nth-child(2) { left: 25%; animation-delay: 1s; font-size: 34px; }
    .heart:nth-child(3) { left: 40%; animation-delay: 2.5s; font-size: 26px; }
    .heart:nth-child(4) { left: 55%; animation-delay: 0.8s; font-size: 30px; }
    .heart:nth-child(5) { left: 70%; animation-delay: 3s; font-size: 24px; }
    .heart:nth-child(6) { left: 85%; animation-delay: 1.8s; font-size: 36px; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0;
      }
      15% { opacity: 0.8; }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.4);
        opacity: 0;
      }
    }

    .card {
      width: min(92%, 430px);
      padding: 34px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(255, 64, 129, 0.25);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
      animation: pop 1s ease;
    }

    @keyframes pop {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .cute-icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6f91, #ff9671);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      box-shadow: 0 12px 28px rgba(255, 105, 135, 0.35);
      animation: heartbeat 1.3s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.08); }
      45% { transform: scale(0.98); }
      70% { transform: scale(1.12); }
    }

    h1 {
      font-size: 32px;
      color: #d6336c;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      color: #6b2d4c;
      margin-bottom: 24px;
    }

    .name {
      color: #ff477e;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 26px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .yes-btn {
      color: white;
      background: linear-gradient(135deg, #ff477e, #ff7eb3);
      box-shadow: 0 12px 25px rgba(255, 71, 126, 0.35);
    }

    .yes-btn:hover {
      transform: translateY(-4px) scale(1.05);
    }

    .no-btn {
      color: #d6336c;
      background: #fff0f6;
      position: relative;
    }

    .message {
      display: none;
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: #fff0f6;
      color: #c2255c;
      font-weight: 700;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer-text {
      margin-top: 22px;
      font-size: 13px;
      color: #a61e4d;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      h1 { font-size: 27px; }
      .card { padding: 28px 20px; }
      button { width: 130px; }
    }
  </style>
</head>
<body>
  <div class="hearts">
    <span class="heart">💗</span>
    <span class="heart">💖</span>
    <span class="heart">💕</span>
    <span class="heart">💘</span>
    <span class="heart">💞</span>
    <span class="heart">❤️</span>
  </div>

  <div class="card">
    <div class="cute-icon">💝</div>
    <h1>Will You Be Mine?</h1>
    <p>
      Hey <span class="name">Paps</span>,<br />
      Every moment with you feels like a sweet dream.  
      I just want to say one simple thing from my heart...
      <br /><strong>I love you forever.</strong>
    </p>

    <div class="buttons">
      <button class="yes-btn" onclick="showLove()">Yes 💖</button>
      <button class="no-btn" id="noBtn">No 🙈</button>
    </div>

    <div class="message" id="loveMessage">
      Yayyy! You made my heart the happiest! 💍💕
    </div>

    <div class="footer-text">Made with love, smiles, and endless hearts ✨</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const loveMessage = document.getElementById("loveMessage");

    function showLove() {
      loveMessage.style.display = "block";
      createConfettiHearts();
    }

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    function createConfettiHearts() {
      for (let i = 0; i < 25; i++) {
        const heart = document.createElement("span");
        heart.textContent = ["💖", "💕", "💗", "💘", "❤️"][Math.floor(Math.random() * 5)];
        heart.style.position = "fixed";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = Math.random() * 18 + 18 + "px";
        heart.style.pointerEvents = "none";
        heart.style.animation = `burst ${Math.random() * 2 + 2}s ease-out forwards`;
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
      }
    }

    const style = document.createElement("style");
    style.innerHTML = `
      @keyframes burst {
        to {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
