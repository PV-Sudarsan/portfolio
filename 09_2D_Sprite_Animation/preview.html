<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite motion preview</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:17px/1.65 system-ui,sans-serif;color:#182d45;background:#f5f8fc}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#185bca}h1{font-size:clamp(32px,5vw,58px);line-height:1.12;letter-spacing:-1.6px}h2{line-height:1.25}section,article{margin:24px 0;padding:28px;background:white;border:1px solid #dbe5f1;border-radius:18px}.hero{background:#e7f1ff;padding:40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid article{margin:0}button,.button{display:inline-block;border:0;background:#2163dc;color:white;border-radius:8px;padding:12px 20px;cursor:pointer;font:inherit;text-decoration:none}input{padding:13px;border:1px solid #8a9fb8;border-radius:8px;font:inherit;max-width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #dbe5f1}img,video{max-width:100%;height:auto}small{color:#587086}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ed9b1c;outline-offset:3px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.hero,section,article{padding:20px}main{padding:16px}h1{letter-spacing:-.8px}}</style><main><h1>A little motion.</h1><section style="height:330px;overflow:hidden;position:relative"><img id="bot" src="sprite.png" alt="Animated robot sprite" width="140" style="position:absolute;bottom:40px;left:0"><div style="position:absolute;bottom:35px;left:0;right:0;border-bottom:3px solid #b8cfe8"></div></section><button id="play">Pause</button></main><footer>Digital Media Lab · Educational sample project</footer><script>const a=document.querySelector('#bot').animate([{left:'0%',transform:'translateY(0)'},{left:'40%',transform:'translateY(-80px)',offset:.5},{left:'75%',transform:'translateY(0)'}],{duration:4000,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});document.querySelector('#play').onclick=e=>{if(a.playState==='running'){a.pause();e.target.textContent='Play'}else{a.play();e.target.textContent='Pause'}}</script></html>
