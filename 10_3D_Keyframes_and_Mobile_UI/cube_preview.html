<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D keyframe preview</title><style>[hidden]{display:none!important}body{font:18px/1.6 system-ui;background:#edf4ff;color:#17314d;text-align:center;padding:30px}.stage{height:370px;display:grid;place-items:center;perspective:700px}.cube{position:relative;width:140px;height:140px;transform-style:preserve-3d;animation:move 5s infinite ease-in-out}.face{position:absolute;width:140px;height:140px;border:2px solid white;background:#2668e6d9;display:grid;place-items:center;color:white;font-size:38px}.f{transform:translateZ(70px)}.b{transform:rotateY(180deg) translateZ(70px)}.r{transform:rotateY(90deg) translateZ(70px)}.l{transform:rotateY(-90deg) translateZ(70px)}.t{transform:rotateX(90deg) translateZ(70px)}.d{transform:rotateX(-90deg) translateZ(70px)}@keyframes move{0%{transform:translateY(40px) rotateX(0) rotateY(0)}50%{transform:translateY(-40px) rotateX(180deg) rotateY(180deg)}100%{transform:translateY(40px) rotateX(360deg) rotateY(360deg)}}button{background:#2266de;color:white;padding:12px 25px;border:0;border-radius:8px;font:inherit}</style><h1>Motion through keyframes.</h1><p>Browser illustration of position and rotation. Open the Blender project generator for the 3D scene and IK rig.</p><div class="stage"><div class="cube" id="cube"><div class="face f">1</div><div class="face b">2</div><div class="face r">3</div><div class="face l">4</div><div class="face t">5</div><div class="face d">6</div></div></div><button onclick="const c=document.querySelector('#cube');const paused=c.style.animationPlayState==='paused';c.style.animationPlayState=paused?'running':'paused';this.textContent=paused?'Pause':'Play'">Pause</button></html>
