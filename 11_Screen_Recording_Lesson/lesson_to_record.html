<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital media basics</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:17px/1.65 system-ui,sans-serif;color:#182d45;background:#f5f8fc}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#185bca}h1{font-size:clamp(32px,5vw,58px);line-height:1.12;letter-spacing:-1.6px}h2{line-height:1.25}section,article{margin:24px 0;padding:28px;background:white;border:1px solid #dbe5f1;border-radius:18px}.hero{background:#e7f1ff;padding:40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid article{margin:0}button,.button{display:inline-block;border:0;background:#2163dc;color:white;border-radius:8px;padding:12px 20px;cursor:pointer;font:inherit;text-decoration:none}input{padding:13px;border:1px solid #8a9fb8;border-radius:8px;font:inherit;max-width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #dbe5f1}img,video{max-width:100%;height:auto}small{color:#587086}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ed9b1c;outline-offset:3px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.hero,section,article{padding:20px}main{padding:16px}h1{letter-spacing:-.8px}}</style><main><small>MICRO COURSE · 5 MINUTES</small><h1>Understand digital media.</h1><progress id="progress" max="3" value="1" aria-label="Lesson progress" style="width:100%"></progress><section id="lesson"></section><button id="back">Back</button> <button id="next">Next</button><p id="feedback" role="status"></p></main><footer>Digital Media Lab · Educational sample project</footer><script>const slides=[['Images: pixels and vectors','Raster images use a grid of pixels and suit photographs. Vector images use paths and suit scalable logos. SVG is a vector format.'],['Audio and video: export with purpose','WAV commonly stores uncompressed PCM audio. MP3 uses lossy audio compression. MP4 is a container; H.264 is a video codec often stored inside it. Keep editable sources before exporting.']];let index=0,api=null;try{let w=window;for(let i=0;i<10;i++){if(w.API){api=w.API;break}if(w.parent===w)break;w=w.parent}if(api){api.LMSInitialize('');api.LMSSetValue('cmi.core.lesson_status','incomplete')}}catch(e){}function show(){document.querySelector('#feedback').textContent='';document.querySelector('#progress').value=index+1;document.querySelector('#back').disabled=index===0;document.querySelector('#next').hidden=index===2;document.querySelector('#lesson').innerHTML=index<2?'<h2>'+slides[index][0]+'</h2><p>'+slides[index][1]+'</p>':'<h2>Check your understanding</h2><form id="quiz"><fieldset><legend>Which format keeps a logo scalable?</legend><label><input type="radio" name="answer" value="png" required> PNG</label><br><label><input type="radio" name="answer" value="svg"> SVG</label><br><label><input type="radio" name="answer" value="mp3"> MP3</label></fieldset><p><button>Check answer</button></p></form>';if(index===2)document.querySelector('#quiz').onsubmit=e=>{e.preventDefault();let correct=new FormData(e.target).get('answer')==='svg';document.querySelector('#feedback').textContent=correct?'Correct! SVG stores paths. Course completed.':'Try again. Look for the vector format.';if(api){api.LMSSetValue('cmi.core.score.raw',correct?'100':'0');api.LMSSetValue('cmi.core.lesson_status',correct?'passed':'incomplete');api.LMSCommit('')}}}document.querySelector('#next').onclick=()=>{index=Math.min(2,index+1);show()};document.querySelector('#back').onclick=()=>{index=Math.max(0,index-1);show()};window.addEventListener('beforeunload',()=>{if(api)api.LMSFinish('')});show();</script></html>
